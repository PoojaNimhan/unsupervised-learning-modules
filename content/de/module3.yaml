    status_messages:
      not_started: "Noch keine Simulation aktiv. Waehle k und Startzentren und initialisiere dann den Ablauf."
      initialized: "Die Startzentren sind gesetzt. Im naechsten Schritt wird jeder Punkt dem naechsten Zentrum zugeordnet."
      assigned: "Alle Punkte sind nun einem Zentrum zugeordnet. Jetzt kannst du die Zentren an die Durchschnittsposition verschieben."
      recomputed: "Die Zentren wurden verschoben. Wenn sie sich noch veraendern, beginnt jetzt die naechste Iteration."
      stable: "Die Zentren bewegen sich kaum noch. Klicke ruhig weiter auf \"Naechste Iteration\" - im Iterationsverlauf unten siehst du, ob sich die Werte wirklich nicht mehr aendern."
    summaries:
