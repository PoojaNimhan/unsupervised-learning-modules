          centers:
            - [10, 7]
            - [11, 4]
            - [5, 10]
        - key: diagonal
          label: "Drei Startzentren mit Schraeglage"
          description: "Auch diese Startwahl braucht mehrere Runden. Vergleiche, wie schnell sich die mittlere und rechte Gruppe trennen."
