      recomputed_intro: "Nun werden aus den zugeordneten Punkten neue Mittelpunkte berechnet. Die alten Kreise und neuen Quadrate zeigen die Bewegung."
      converged_intro: "Die neu berechneten Mittelpunkte stimmen mit den bisherigen ueberein. Weitere Iterationen wuerden nichts mehr aendern."
