            - [7, 3]
            - [6, 7]
            - [9, 7]
concept:
  heading: Fachkonzept
  heart_heading: "Das mathematische Herzstück von K-Means"
  heart_intro: >
    K-Means ermittelt die optimalen Clusterzentren, indem es die
    Gesamtentfernung zwischen jedem Punkt und seinem zugewiesenen Zentrum
    minimiert. Der Algorithmus wiederholt diese beiden Schritte so lange, bis
    sich die Lösung stabilisiert:
  heart_steps:
    - "Schritt 1: Jedem Punkt wird das nächstgelegene Zentrum zugewiesen."
    - "Schritt 2: Jedes Zentrum wird zum Mittelwert aller ihm zugewiesenen Punkte verschoben."
  key_formula_heading: "Die Schlüsselformel"
  key_formula_intro: "Neue Mittelposition (nach jeder Iteration):"
  key_formula_plain_heading: "Kurz gesagt:"
  key_formula_plain_body: >
    Ein neues Clusterzentrum ist einfach der Durchschnitt aller Punkte, die
    ihm zugeordnet sind. Du addierst also die Positionen dieser Punkte und
    teilst die Summe durch die Anzahl der Punkte - genau wie beim Berechnen
    eines gewöhnlichen Notendurchschnitts.
  key_formula_plain_example: >
    Beispiel: Drei Punkte mit den x-Werten 2, 4 und 6 gehören zu einem
    Cluster. Neue Mitte: (2 + 4 + 6) / 3 = 4.
  key_formula_note: "(Neuer Mittelpunkt = Mittelwert der Positionen aller Punkte in der Gruppe.)"
  key_formula_expanded_label: "Ausführlich geschrieben ist die Summe im Zähler nichts anderes als:"
  symbol_heading: "Symbolerklärung:"
  symbol_items:
    - "&mu;<sub>j</sub> = neue Position des Clusterzentrums j"
    - "N<sub>j</sub> = Anzahl der Punkte im Cluster j"
    - "C<sub>j</sub> = alle dem Cluster j zugeordneten Punkte"
    - "x<sub>i</sub> = Position jedes Punktes i in diesem Cluster"
    - '&Sigma; = alle Positionen "aufsummieren"'
  one_dimensional_example:
    heading: "Berechnung für einen Kuchenstand"
    intro: >
      Szenario: 6 Besucher an den Positionen: [1, 2, 3, 10, 11, 12] (auf
      einer eindimensionalen Linie, die den Schulhof darstellt). Wir möchten
      K=2 Stände.
    iteration_one_heading: "Iteration 1"
    iteration_one_lines:
      - "Beginne mit zufälligen Mittelpunkten: C1 = 2, C2 = 11"
      - "Punkte nach Entfernung vergeben:"
      - "Cluster 1: (am nächsten zu 2)"
      - "Cluster 2: (am nächsten zu 11)"
      - "Neue Mittelpunkte berechnen:"
      - "&mu;<sub>1</sub> = (1 + 2 + 3) / 3 = 2"
      - "&mu;<sub>2</sub> = (10 + 11 + 12) / 3 = 11"
    iteration_two_heading: "Iteration 2"
    iteration_two_lines:
      - "Die Center stehen weiterhin auf Position 2 und 11, gleiche Aufgabe."
      - "Die neuen Zentren sind weiterhin 2 und 11."
    result: >
      Ergebnis: Der Algorithmus ist konvergiert. Setze Ställe an den
      Positionen 2 und 11.
    alternate_start_heading: "Was wäre, wenn der Ausgangspunkt ein anderer wäre? Versuche es doch einmal mit den Mittelpunkten bei [5, 6]:"
    alternate_start_lines:
      - "Aufgabe: C1, C2."
      - "Neue Zentren landen immer noch bei ."
    alternate_result: "K-Means findet (meistens) dieselbe gute Lösung, unabhängig davon, wo man beginnt."
  distance_heading: "Entfernungsmessung"
  distance_intro: >
    K-Means verwendet den euklidischen Abstand (geradliniger Abstand):
  two_dimensional_example:
    heading: "2D-Beispiel: Cake Stalls auf dem Schulhof. 6 Besucherpositionen (x,y Koordinaten in Metern):"
    visitor_lines:
      - "A: (1|2)    B: (2|1)    C: (3|3)"
      - "D: (10|9)   E: (11|10)  F: (9|11)"
    setup_line: "K = 2 Stände | Start: C1=(2|2), C2=(10|10)"
    distance_formula_heading: "Entfernungsformel (Euklidische Distanz)"
    iteration_one_heading: "Iteration 1"
    iteration_one_lines:
      - "Abstände zu C1(2|2): A=1.4, B=1.4, C=2.0, D=11.3, E=12.0, F=12.0"
      - "Abstände zu C2(10|10):A=11.3,B=12.0,C=10.4,D=1.4,E=1.4,F=2.2"
      - "Zuordnung:"
      - "Cluster 1: A,B,C → Neues C1: &mu;<sub>1</sub> = ((1+2+3)/3|(2+1+3)/3) = (2,0|2,0)"
      - "Cluster 2: D,E,F → Neues C2: &mu;<sub>2</sub> = ((10+11+9)/3|(9+10+11)/3) = (10,0|10,0)"
    iteration_two_heading: "Iteration 2"
    result: >
      Konvergiert! Endgültige Stände: (2,0|2,0) & (10,0|10,0)
  dimension_note_heading: "Hinweis zu Dimensionen"
  dimension_note_body: >
    Die hier gezeigten Beispiele verwenden ein- oder zweidimensionale Daten, da
    sie sich leicht visualisieren lassen. In realen Anwendungen bestehen
    Datenpunkte jedoch oft aus vielen Merkmalen (z. B. Alter, Interessen,
    Kaufverhalten), sodass sie in einem hochdimensionalen Raum liegen. K-Means
    funktioniert auch in diesen Fällen, jedoch ist die Struktur der Daten dann
    nicht mehr direkt sichtbar, sondern muss rechnerisch erschlossen werden.
exercises:
  heading: Übungen
  intro: >
    Im Folgenden findest du die Standorte der Besucher auf dem Schulgelände. Du
    musst einige Aufgaben lösen, um die Position der Kuchenstände zu finden.
  visitors_heading: "6 Besucher andiesen 2D-Positionen:"
  visitors:
    - "Besucher 1: (1|2)"
    - "Besucher 2: (2|1)"
    - "Besucher 3: (3|3)"
    - "Besucher 4: (9|10)"
    - "Besucher 5: (10|9)"
    - "Besucher 6: (11|11)"
  distance_helper:
    heading: "Distanzmatrix selbst berechnen"
    intro: "Lege eigene Zentren und Datenpunkte fest. Nach dem Klick auf \"Berechnen\" siehst du fuer jeden Punkt die Distanz zu jedem Zentrum."
    cluster_count_label: "Anzahl der Cluster (k)"
    centers_heading: "Zentren eingeben"
    points_heading: "Datenpunkte eingeben"
    add_point_label: "Datenpunkt hinzufuegen"
    remove_point_label: "Entfernen"
    calculate_label: "Berechnen"
    results_heading: "Distanztabelle"
    point_column_label: "Datenpunkt"
    center_label_template: "C{index}"
    point_label_template: "P{index}"
    label_column: "Bezeichnung"
    x_label: "x"
    y_label: "y"
    actions_label: "Aktion"
    validation_missing_coordinates: "Bitte fuelle zuerst alle x- und y-Koordinaten fuer Zentren und Datenpunkte aus."
    validation_invalid_numbers: "Bitte gib nur gueltige Zahlen fuer alle Koordinaten ein."
  exercise_blocks:
    - heading: "Übung 1: Basic Clustering"
      dataset_intro: "K = 2 Stände und Start-Center:"
      setup_items:
        - "C1 = (2|2)"
        - "C2 = (10|10)"
      formula_after_task: 3
      tasks:
        - Berechne die Entfernung jedes Besuchers zu beiden Zentren.
        - Ordne jeden Besucher dem nächstgelegenen Zentrum zu. Welche Besucher gehen zu C1? Welche zu C2?
        - "Berechne die neuen Mittelpunkte anhand der folgenden Formel:"
        - Führe eine zweite Iteration durch. Ändern sich die Mittelpunkte?
        - Wo sollen die Kuchenstände aufgestellt werden? Warum?
    - heading: "Übung 2: Unterschiedliche Ausgangspunkte"
      dataset_intro: >
        Derselbe Datensatz. Nun ist K = 2, aber wir beginnen mit ungünstigen
        Zentren: C1 = (5|5), C2 = (6|6)
      tasks:
        - Weisen Sie Besucher den nächstgelegenen Zentren zu.
        - Berechne die neuen Mittelpunkte nach Iteration 1.
        - Führe Iteration 2 durch. Was passiert?
        - "Vergleiche: Hast du am Ende dieselben Endpunkte wie in Übung 1 erhalten?"
    - heading: "Übung 3: WählenK=3"
      dataset_intro: "Neuer Datensatz:"
      setup_items:
        - "A = (1|1)"
        - "B = (1|2)"
        - "C = (2|1)"
        - "D = (3|3)"
        - "E = (10|10)"
        - "F = (11|10)"
        - "G = (10|11)"
        - "H = (12|12)"
      followup_lines:
        - "K = 3 Stände"
        - "Fang einfach irgendwo an (ganz wie du willst)."
      tasks:
        - Wähle deine 3 Start-Center aus.
        - Führe zwei Iterationen durch.
        - Zeichne die Punkte und die Endpunkte auf Millimeterpapier.
        - "Diskussion: Inwiefern unterscheiden sich die 3 Cluster von K=2?"
    - heading: "[Optional] Übung 4: Praktische Anwendung in der Schule"
      dataset_intro: >
        Deine Aufgabe: Zeichne einen Plan deines Schulhofs (erstelle eine
        einfache Skizze).
      tasks:
        - Markiere 10 imaginäre Besucherplätze.
        - Führe K-Means mit K=3 durch.
        - "Präsentation: „Meine Kuchenstände stehen an den Stellen X, Y und Z, weil …“"
        - "Gruppenaufgabe: Vergleicht mit euren Klassenkameraden, wessen Stände den Hof am besten abdecken?"
