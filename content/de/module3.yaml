title: "Modul 3: K-Means auf dem Schulhof"
intro: >
  Auf dem Schulhof stehen Besucherinnen und Besucher an verschiedenen Stellen.
  Deine Aufgabe ist es, Kuchenstaende so zu platzieren, dass die Wege moeglichst
  kurz werden. Genau diese Idee steckt hinter K-Means.
exploration:
  heading: Erkundung
  scenario_heading: "Aufgabe:"
  scenario: >
    Deine Schule veranstaltet ein großes Sommerfest. Viele Klassen backen
    Kuchen, um diese zu verkaufen und Geld für eine Klassenfahrt zu sammeln.
    Das Problem:
  scenario_points:
    - Jeder möchte, dass sein Kuchenstand an einem guten Standort steht.
    - Die Besucher sollten nicht zu weit laufen müssen, um Kuchen zu kaufen.
    - Zwischen den Ständen sollte genügend Platz sein, damit es nicht zu eng wird.
  question_heading: "Die Frage lautet also:"
  question: >
    Wie viele Kuchenstände sollen wir aufstellen, und wo sollen wir sie auf
    dem Schulhof platzieren?
  reflection_heading: "Frage dich selbst:"
  prompts:
    - question: "Was passiert, wenn alle Stände nebeneinander stehen?"
      answer: "Besucher, die weit weg sind, kommen nicht, weil der Weg zu weit ist."
    - question: "Welche Probleme könnten auftreten, wenn sie zu weit verstreut sind?"
      answer: "Vielleicht bekommen einige Stände nicht genug Kunden."
  task_heading: "Erkundungsaufgabe"
  task_steps:
    - Nimm eine Karte des Schulhofs (oder ein einfaches Koordinatengitter).
    - Markiere verschiedene Orte, von denen die Besucher normalerweise kommen (z. B. Klassenzimmer, Eingang, Spielplatz). Jeder Ort könnte als Punkt auf der Karte dargestellt werden.
    - Stell dir nun vor, du hättest nur zwei oder drei Stände. Wo sollten diese aufgestellt werden, damit die Besucher den nächstgelegenen leicht erreichen können?
structuring:
  heading: Strukturierung
  intro: >
    Bei der Untersuchung hast du gesehen, dass Besucher oder Punkte, die nahe
    beieinander liegen, ganz natürlich Gruppen bilden. Was wir nun suchen, ist
    eine systematische Methode, um diese Gruppen zu finden - nicht nur durch
    Betrachten, sondern mit Hilfe eines Computers und der Mathematik. Hier
    kommt das K-Means-Clustering ins Spiel.
  definition_heading: "Definition: Was ist K-Means?"
  definition_body: >
    K-Means ist ein Algorithmus des maschinellen Lernens, der Datenpunkte
    automatisch in K Gruppen, sogenannte Cluster, einteilt, je nachdem, wie
    nah die Punkte beieinander liegen.
  definition_points:
    - Das „K“ steht für die Anzahl der Gruppen, die man finden möchte.
    - Der Begriff „Means“ leitet sich vom Mittelwert ab, da jede Gruppe durch die mittlere (durchschnittliche) Position ihrer Mitglieder repräsentiert wird.
  definition_closing: >
    Man kann sich den Algorithmus als einen Gruppensucher vorstellen, der viele
    Punkte betrachtet und sagt: „Diese Punkte gehören zusammen, weil sie nahe
    beieinander liegen.“
  schoolyard_mapping_heading: "Bei unserem Schulfest:"
  mapping_items:
    - Jeder Besucher = ein Datenpunkt (Punkt).
    - Jeder Kuchenstand = ein Clusterzentrum (der Mittelwert).
    - Mit der K-Means-Methode lässt sich ermitteln, wo jeder Stand platziert werden sollte, damit er möglichst vielen Besuchern nahe ist.
  algorithm_heading: "So funktioniert K-Means (Schritt-für-Schritt-Erklärung)"
  algorithm_intro: >
    Hier ist der logische Ablauf, ohne mathematische Formeln:
  algorithm_steps:
    - "Wähle K – die Anzahl der Gruppen oder Stände, die du haben möchtest."
    - "Platziere K Startpunkte an beliebigen Stellen (so als würdest du raten, wo die Kuchenstände stehen könnten)."
    - "Weise den Besuchern den nächstgelegenen Stand zu (jeder Besucher geht zum nächstgelegenen Startpunkt)."
    - "Verschiebe den Stand an die durchschnittliche Position seiner Besucher."
    - "Wiederhole die Schritte 3 und 4, bis sich kein Stand mehr bewegt; dann hast du die besten Positionen gefunden."
  stepper:
    controls:
      k_label: "Wie viele Kuchenstaende sollen verglichen werden?"
      preset_label: "Welche Startpositionen moechtest du ausprobieren?"
      show_labels_label: "Besucher-IDs direkt anzeigen"
      show_distance_label: "Distanzlinien im Zuordnungsschritt anzeigen"
      initialize_label: "Initialisieren"
      assign_label: "Zuordnen"
      recompute_label: "Zentren neu berechnen"
      next_iteration_label: "Naechste Iteration"
      reset_label: "Reset"
      changed_selection_notice: >
        Du hast die Auswahl geaendert. Klicke auf "Initialisieren", um mit der
