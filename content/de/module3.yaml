          centers:
            - [0, 0]
            - [0, 1]
        - key: balanced
          label: "PDF-Start: zwei gut verteilte Zentren"
          description: "Die Zentren starten fast direkt an der Endloesung. Das ist gut zum Vergleich, aber der Ablauf ist deutlich kuerzer."
          centers:
            - [2, 2]
            - [10, 10]
      3:
        - key: iterative
          label: "Drei unguenstige Startzentren"
